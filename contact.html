    <!-- Contact Section -->
    <section class="py-5 text-center bg-light">
        <div class="container">
            <h2 class="mb-4">Contact Us</h2>
            <div class="row mb-5 contact-container">
                <div class="col-lg-6 col-md-12 mb-4">
                    <form>
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea class="form-control" id="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
                <div class="col-lg-6 col-md-12 mb-4 contact-details">
                    <p><strong>Email:</strong> info@elevateschool.org</p>
                    <p><strong>Phone:</strong> +256 752 108 591</p>
                    <p><strong>Follow Us:</strong> <a href="https://www.facebook.com/era92elevate/">Facebook</a> | <a href="https://ug.linkedin.com/company/era92-elevate">LinkedIn</a></p>
                </div>
            </div>
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7979.498991758944!2d32.56917278618291!3d0.3365372273385305!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177dbb0c26914351%3A0x3b86831f1cf69906!2sKatanga%20Slum%2C%20Kampala!5e0!3m2!1sen!2sug!4v1744359191525!5m2!1sen!2sug" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" placeholder="kangaslumgooglemaplocation"></iframe>
            </div>
        </div>
    </section>
